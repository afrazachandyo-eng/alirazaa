[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to Netlify Functions
[[redirects]]
  from = "/api/ai/recommendations"
  to = "/.netlify/functions/recommendations"
  status = 200

# Handle SPA routing (redirect all other paths to index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
